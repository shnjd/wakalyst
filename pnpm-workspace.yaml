packages:
  - apps/*
  - packages/*

# Dependencies allowed to run install scripts.
allowBuilds:
  esbuild: true
  workerd: true

# Shared versions: every workspace package refers to these with "catalog:".
catalog:
  typescript: ~6.0.3
  vitest: ^5.0.3
  zod: ^4.6.6
  react: 19.2.3
  "@tanstack/react-query": ^5.104.1
  zustand: ^5.0.15
