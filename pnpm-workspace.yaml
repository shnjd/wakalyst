packages:
  - apps/*
  - packages/*

# Dependencies allowed to run install scripts.
allowBuilds:
  esbuild: true
  workerd: true

# Shared versions: every workspace package refers to these with "catalog:".
catalog:
  typescript: ~6.0.3
  vitest: ^5.0.3
  zod: ^4.6.6
  react: 19.2.3
  "@tanstack/react-query": ^5.104.1
  zustand: ^5.0.15

# pnpm auto-installs peers (optional ones too, like expo-router's reanimated and
# gesture-handler) at their latest version. Pin the ones Expo SDK 57
# expects so native builds don't autolink an unsupported version.
minimumReleaseAgeExclude:
  - zod@4.6.6

overrides:
  react-native-worklets: 0.10.1
  react-native-reanimated: 4.5.1
  react-native-gesture-handler: ~2.32.0
  "@react-native/metro-config": 0.86.3
